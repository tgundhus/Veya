name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"     # Monday morning: catch CVEs disclosed since the last push

# Cancel outdated pull request runs; on main, run per commit.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Jobs that need more ask for it explicitly.
permissions: read-all

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks needs history to scan every commit in the PR
      - name: gitleaks (diff)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The action above only scans the commits in this push or PR. That misses a secret that
      # entered on an earlier commit and is still sitting in the tree -- exactly how a CLI
      # transcript quoting a PyPI token once survived in main. This second pass
      # scans the checked-out files themselves, so anything present in HEAD is caught no matter
      # which commit put it there.
      - name: gitleaks (working tree)
        run: |
          VER=8.30.1
          # Digest of gitleaks_${VER}_linux_x64.tar.gz from the v${VER} release,
          # cross-checked against gitleaks_${VER}_checksums.txt in the same release.
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

  deps:
    name: dependency CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Audit declared dependencies
        run: |
          # Audit what the package DECLARES, not a local install. Installing torch from the
          # PyTorch CPU index yields a local version (2.14.0+cpu) that does not exist on PyPI,
          # so pip-audit cannot resolve it and --strict fails the job on that alone.
          #
          # Every declared name, not just [project.dependencies]: the extras are what an
          # install actually pulls in. `Dockerfile` ends with `pip install ".[serve]"`, so
          # fastapi/uvicorn/python-multipart and their transitive closure ship in the image,
          # and an advisory in any of them would be invisible to a core-only audit. Read the
          # tables rather than transcribing a list, so an extra added later is audited by the
          # commit that adds it and not by a follow-up that forgets.
          python - <<'PY' > requirements-audit.txt
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]
          specs = list(project.get("dependencies", []))
          for extra in project.get("optional-dependencies", {}).values():
              specs.extend(extra)
          seen = set()
          for spec in specs:          # `langchain` and `langgraph` repeat two of these
              if spec not in seen:
                  seen.add(spec)
                  print(spec)
          PY
          cat requirements-audit.txt
          echo "auditing $(wc -l < requirements-audit.txt) declared names: the core plus every extra"
          # No single install holds every extra: the crewai releases that pin a patched json-repair
          # also pin mcp~=1.28, while the mcp extra needs mcp>=2.2. Resolved together, the list
          # audits a crewai old enough to accept both, which nobody installs. So it is audited as
          # the two largest installs that can exist, one without crewai and one without mcp.
          grep -v '^crewai' requirements-audit.txt > requirements-audit-without-crewai.txt
          grep -v '^mcp' requirements-audit.txt > requirements-audit-without-mcp.txt
          # What the package and its image ship -- the core plus [serve], the one extra the
          # Dockerfile installs -- is audited on its own too, and nothing in it may be accepted.
          python -c 'import tomllib; p = tomllib.load(open("pyproject.toml", "rb"))["project"]; print("\n".join(p["dependencies"] + p["optional-dependencies"]["serve"]))' > requirements-audit-shipped.txt
          # pip-audit's verdict is every advisory it finds; scripts/pip_audit_policy.py gives this
          # repository's. It fails on an advisory nobody accepted, on an accepted one once a fix
          # exists, and on a dependency that could not be audited, and passes the reviewed,
          # unfixable ones in .github/accepted-advisories.toml with a warning.
          status=0
          for req in requirements-audit-shipped.txt requirements-audit-without-crewai.txt \
                     requirements-audit-without-mcp.txt; do
            report="${req%.txt}.json"
            pip-audit --strict --desc -r "$req" -f json -o "$report" || true
            if [ ! -s "$report" ]; then
              echo "::error::pip-audit wrote no report for $req: it could not resolve or audit it"
              status=1
            fi
          done
          python scripts/pip_audit_policy.py --accepted .github/accepted-advisories.toml \
            --shipped requirements-audit-shipped.json \
            requirements-audit-without-crewai.json requirements-audit-without-mcp.json || status=1
          exit $status

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  supply_chain:
    name: no unsafe deserialization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Weights must load through safetensors, never pickle
        run: |
          # torch.load / pickle execute arbitrary code during deserialization. Veya loads
          # checkpoints from the Hub, so a pickle path would be remote code execution on
          # `veya.load("someone/their-model")`.
          if grep -rnE --include='*.py' "\bpickle\b|torch\.load\(|joblib\.load\(|yaml\.load\(" veya/ veya-ts/scripts/; then
            echo "::error::unsafe deserialization in the shipped package - use safetensors"
            exit 1
          fi
          echo "OK: no unsafe deserialization in veya/ or veya-ts/scripts/"
      - name: No shell-out or dynamic exec in the shipped package
        run: |
          # Only the bounded QuickJS guest entry point is allowed; Python eval/exec
          # and every other matching call remain forbidden, including in that worker.
          if grep -rnE "os\.system\(|subprocess\.|shell=True|\beval\(|\bexec\(" veya/ \
               | grep -v "\.eval()" \
               | grep -vE '^veya/mcp/_code_worker\.py:[0-9]+:        pump = bounded\(lambda: context\.eval\(program\)\)$'; then
            echo "::error::shell-out or dynamic execution in the shipped package"
            exit 1
          fi
          echo "OK: no Python eval/exec or shell-out in veya/"
      - name: ONNX exporter requires safetensors weights
        run: python tests/test_export_onnx_safety.py
