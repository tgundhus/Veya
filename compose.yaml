services:
  veya:
    build:
      context: .
      args:
        TORCH_INDEX: "${VEYA_TORCH_INDEX:-cpu}"
        TORCH_VERSION: "${VEYA_TORCH_VERSION:-2.14.0}"
    environment:
      VEYA_DEVICE: "${VEYA_DEVICE:-cpu}"
      # The autocast dtype the runtime picks when it builds the model on the selected device
      # (`veya/agent.py`). An empty value means "use the checkpoint's own `amp_dtype`", which is
      # what these images have always served. README's threshold section measures what fp16 vs
      # bf16 decides differently.
      VEYA_CUDA_AMP: "${VEYA_CUDA_AMP:-}"
      VEYA_CPU_AMP: "${VEYA_CPU_AMP:-}"
      VEYA_MODEL: "${VEYA_MODEL:-auto}"
      VEYA_MODEL_PATH: "${VEYA_MODEL_PATH:-}"
      VEYA_REQUEST_FILE: "${VEYA_REQUEST_FILE:-/opt/veya/examples/request.json}"
      # The Hub commit, branch or tag every checkpoint download resolves to, or `reviewed` for the
      # reviewed SHAs in `veya/revisions.py`. Empty keeps the Hub default, which is what these
      # images have always done. This service builds its Router with no `revision=` argument
      # (`examples/docker/quickstart.py`), so this variable is the only way to pin from Compose.
      VEYA_REVISION: "${VEYA_REVISION:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_TOKEN_FILE: "${HF_TOKEN_FILE:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
    volumes:
      - model-cache:/home/veya/.cache/huggingface
    init: true

volumes:
  model-cache:
    name: "${VEYA_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_model-cache}"
