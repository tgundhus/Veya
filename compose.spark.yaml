# DGX Spark is Linux ARM64 with NVIDIA CUDA 13.0, not Apple MPS or Jetson.
# Use instead of compose.cuda.yaml, with compose.yaml for the SDK quickstart and
# with compose.http.yaml as well for the HTTP server:
#   docker compose -f compose.yaml -f compose.spark.yaml run --build --rm veya
#   docker compose -f compose.yaml -f compose.http.yaml -f compose.spark.yaml up --build veya-serve
# `veya-serve` repeats the settings because it is a separate service; overrides
# for `veya` never reach it.
services:
  veya:
    platform: linux/arm64
    build:
      args:
        TORCH_INDEX: "${VEYA_TORCH_INDEX:-cu130}"
    environment:
      VEYA_DEVICE: "${VEYA_DEVICE:-cuda}"
      # Autocast dtype the runtime reads; empty keeps the checkpoint's own `amp_dtype`. Both
      # services need it, because an override on `veya` never reaches `veya-serve`.
      VEYA_CUDA_AMP: "${VEYA_CUDA_AMP:-}"
      VEYA_CPU_AMP: "${VEYA_CPU_AMP:-}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VEYA_GPU_ID:-0}"]
              capabilities: [gpu]

  veya-serve:
    platform: linux/arm64
    build:
      context: .
      args:
        TORCH_INDEX: "${VEYA_TORCH_INDEX:-cu130}"
    environment:
      VEYA_DEVICE: "${VEYA_DEVICE:-cuda}"
      # Autocast dtype the runtime reads; empty keeps the checkpoint's own `amp_dtype`. Both
      # services need it, because an override on `veya` never reaches `veya-serve`.
      VEYA_CUDA_AMP: "${VEYA_CUDA_AMP:-}"
      VEYA_CPU_AMP: "${VEYA_CPU_AMP:-}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VEYA_GPU_ID:-0}"]
              capabilities: [gpu]
