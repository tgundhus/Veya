[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veya-onnx"
version = "0.3.29"
description = "Local Veya ONNX inference without PyTorch or Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Convai Innovations" }, { name = "Tobias Gundhus" }]
dependencies = ["numpy>=1.24.2", "onnxruntime>=1.20.0", "tokenizers>=0.20.0", "huggingface_hub>=0.20.0"]

[project.optional-dependencies]
structured = ["pydantic>=2.0.0"]
serve = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
mcp = ["mcp>=2.2.0"]
codemode = ["mcp>=2.2.0", "quickjs-ng>=0.18.0.1,<0.19", "psutil>=5.9.8"]
replay = ["onnx>=1.20.0"]

[project.scripts]
laya-onnx-serve = "laya_onnx.serve:main"
laya-onnx-mcp = "laya_onnx.mcp.server:main"
laya-onnx-replay = "laya_onnx.replay:main"

[project.urls]
Homepage = "https://tgundhus.github.io/Veya/"
Documentation = "https://tgundhus.github.io/Veya/onnx-runtime/"
Repository = "https://github.com/tgundhus/Veya"
Issues = "https://github.com/tgundhus/Veya/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_onnx = ["py.typed"]
